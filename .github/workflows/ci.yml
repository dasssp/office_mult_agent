name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m mypy app
      - run: docker build --tag office-multi-agent:ci .

  postgres-recovery:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: office_multi_agent_test
          POSTGRES_USER: office_test
          POSTGRES_PASSWORD: office_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U office_test -d office_multi_agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://office_test:office_test_password@localhost:5432/office_multi_agent_test
      TEST_DATABASE_URL: postgresql+asyncpg://office_test:office_test_password@localhost:5432/office_multi_agent_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: alembic upgrade head
      - run: python -m pytest tests/integration/test_postgres_deep_recovery.py -q
