image: python:3.11

stages:
  - validate
  - integration
  - build

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip

before_script:
  - python -m pip install --upgrade pip
  - python -m pip install -e ".[dev]"

verify:
  stage: validate
  script:
    - python -m pytest -q
    - python -m ruff check .
    - python -m mypy app

redis-cache:
  stage: integration
  services:
    - name: redis:7-alpine
      alias: redis
  variables:
    TEST_REDIS_URL: "redis://redis:6379/0"
  script:
    - python -m pytest tests/integration/test_redis_cache.py -q

postgres-recovery:
  stage: integration
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_DB: office_multi_agent_test
    POSTGRES_USER: office_test
    POSTGRES_PASSWORD: office_test_password
    DATABASE_URL: "postgresql+asyncpg://office_test:office_test_password@postgres:5432/office_multi_agent_test"
    TEST_DATABASE_URL: "postgresql+asyncpg://office_test:office_test_password@postgres:5432/office_multi_agent_test"
  script:
    - alembic upgrade head
    - python -m pytest tests/integration/test_postgres_deep_recovery.py -q

container-build:
  stage: build
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
  before_script: []
  script:
    - docker build --tag office-multi-agent:$CI_COMMIT_SHA .
