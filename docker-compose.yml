services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: office_multi_agent
      POSTGRES_USER: office_app
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U office_app -d office_multi_agent"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
